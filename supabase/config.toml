# Supabase project config, committed so each Edge Function's
# JWT-verification setting is version-controlled rather than living only as
# an uncommitted gateway toggle in the dashboard.
#
# Why this file is intentionally minimal: it exists to codify ONE thing —
# the gateway JWT check per function: on for delete-account, and off for
# redeem-handoff, the single deliberate exception (INVARIANTS #30). We
# deliberately do NOT mirror the full `supabase init` output (the local
# dev-stack config for api/db/auth/storage/etc.) here: every extra section is
# another thing that can drift from the hosted project. `project_id` is the
# only required top-level key; `[functions.*]` blocks are additive. The one
# local stack this project runs is CI's database-test job
# (.github/workflows/ci-db.yml, SPEC-20 R9), which uses the CLI's defaults
# for everything not set here.
#
# See supabase/EDGE_FUNCTION_DEPLOYMENT.md for the deploy rules — in
# particular, NEVER deploy delete-account with --no-verify-jwt.
project_id = "kinderwell"

# Gateway-level JWT verification for the account-deletion function. With
# verify_jwt = true, Supabase's Edge Function gateway rejects any request
# whose Authorization bearer token isn't a valid, unexpired project JWT
# BEFORE the function code runs. This is the first of two layers; the
# function ALSO re-verifies the token signature in-code (defense in depth —
# see handler.ts; tested in handler_test.ts). Committing it here means a redeploy can't silently ship
# with verification turned off.
[functions.delete-account]
verify_jwt = true

# The purchase handoff (SPEC-21): swaps a one-time key from kinderwell.app for
# a sign-in. The ONE app-facing function with the gateway JWT check OFF
# (INVARIANTS #30): the app calls it before it has a session, and the app's
# publishable key is not a JWT, so the gateway would refuse every caller.
# What protects it instead lives in the function and is tested in its
# handler_test.ts: the 256-bit single-use key, the entitlement check before a
# session is minted, and a per-IP rate limit. Deploy:
#   supabase functions deploy redeem-handoff --no-verify-jwt
# (this block makes the flag explicit even when it is forgotten).
# edgeFunctionGuards.test fails if any OTHER function turns its check off.
[functions.redeem-handoff]
verify_jwt = false
