# A kinderwell.app buyer on a fresh install: Sign in → email code → straight
# into the app, no questionnaire and no paywall (SPEC-20 R10 flow 2). Then the
# swipe-back regression (2026-09-15): a swipe from the left edge must not
# leave the app for the onboarding questions (flow 4).
appId: ${APP_ID}
---
- runFlow: ../subflows/launch-fresh.yaml
- tapOn: "Sign in"
- runFlow:
    file: ../subflows/email-code.yaml
    env:
      EMAIL: ${BUYER_EMAIL}
- extendedWaitUntil:
    visible:
      id: "learn-current-card"
    timeout: 30000
- assertNotVisible: "Who are you parenting as?"
- swipe:
    start: 2%, 50%
    end: 90%, 50%
    duration: 400
- assertVisible:
    id: "learn-screen"
- assertNotVisible: "Get started"
